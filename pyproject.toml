[project]
name = "graph-fraud-drift"
version = "0.1.0"
description = "Graph-based illicit-transaction detection on the Elliptic Bitcoin graph under a strict temporal split: XGBoost vs. graph features vs. GraphSAGE/GAT, cost-sensitive thresholds and drift analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reagan Kesseku" }]
license = { text = "MIT" }
keywords = ["fraud-detection", "graph-neural-networks", "anti-money-laundering", "concept-drift", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
tune = ["optuna>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "optuna>=3.0"]

[project.scripts]
graphfraud = "graphfraud.cli:main"

[project.urls]
Homepage = "https://github.com/rkesseku/graph-fraud-drift"
Repository = "https://github.com/rkesseku/graph-fraud-drift"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphfraud*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
